:root{
  --page:#e7e7e4; --panel:#ffffff; --ink:#1c1c1c; --muted:#6a6a68; --line:#d4d4d0;
  --accent:#1f5eff; --hole:rgba(0,0,0,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#151515; --panel:#232323; --ink:#efefef; --muted:#a2a2a2; --line:#3a3a3a; --accent:#6f95ff;
  }
}
:root[data-theme="dark"]{
  --page:#151515; --panel:#232323; --ink:#efefef; --muted:#a2a2a2; --line:#3a3a3a; --accent:#6f95ff;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:"Times New Roman",Times,"BiauKai","DFKai-SB","標楷體","UIKai",serif;
  font-size:18px; line-height:1.55; -webkit-tap-highlight-color:transparent;
}
button,select,input{font:inherit;color:inherit}
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; background:var(--page);
}
.bar h1{font-size:22px; font-weight:700; margin:0; letter-spacing:.02em}
.actions{display:flex; gap:8px}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:38px; padding:0 14px; border-radius:19px;
  border:1px solid var(--line); background:var(--panel); cursor:pointer;
  font-size:16px; font-weight:500; white-space:nowrap;
}
.btn.primary{background:var(--ink); color:var(--page); border-color:var(--ink)}
.btn:disabled{opacity:.4; cursor:default}
.btn:focus-visible,.chip:focus-visible,.cell:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,.sw:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
main{max-width:860px; margin:0 auto; padding:0 16px 150px}

.empty{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:56px 20px; margin-top:12px; background:var(--panel); border-radius:6px;
}
.empty .tiles{display:grid; grid-template-columns:repeat(4,22px); grid-auto-rows:22px; gap:4px; margin-bottom:22px}
.empty .tiles span{background:var(--line)}
.empty .tiles .a{grid-column:span 2; grid-row:span 2}
.empty .tiles .b{grid-column:span 2}
.empty .tiles .c{grid-row:span 2}
.empty p{color:var(--muted); margin:14px 0 0; max-width:30em; font-size:14px}

.hint{color:var(--muted); font-size:13px; margin:4px 0 10px}
.board{position:relative; width:100%; user-select:none; -webkit-user-select:none; touch-action:manipulation}
.cell{position:absolute; overflow:hidden; cursor:pointer; background:#ddd}
.cell img{position:absolute; max-width:none; display:block; pointer-events:none; -webkit-user-drag:none}

.cell.sel{outline:3px solid var(--accent); outline-offset:2px; z-index:2}
.board.picking .cell:not(.sel){opacity:.8}
.hole{position:absolute; background:var(--hole); pointer-events:none}
.count{color:var(--muted); font-size:13px; margin:10px 0 0}

details.settings{margin-top:18px; background:var(--panel); border-radius:6px; padding:0 16px}
details.settings summary{cursor:pointer; padding:14px 0; font-weight:500; list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:"＋"; float:right; color:var(--muted)}
details.settings[open] summary::after{content:"－"}
.row{display:grid; grid-template-columns:5.5em 1fr 3em; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
.row label{font-size:14px}
.row output{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px}
.row input[type=range]{width:100%; accent-color:var(--ink)}
.swatches{display:flex; gap:10px}
.sw{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent); outline-offset:2px}
.btnrow{display:flex; flex-wrap:wrap; gap:8px; padding:14px 0 16px; border-top:1px solid var(--line)}
select{min-height:34px; border-radius:6px; border:1px solid var(--line); background:var(--panel); padding:0 8px}

.selbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--panel); border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -8px 24px rgba(0,0,0,.08);
  transform:translateY(110%); transition:transform .2s ease;
}
.selbar.show{transform:none}
.selbar .inner{max-width:860px; margin:0 auto}
.selbar .label{font-size:12px; color:var(--muted); margin-bottom:6px}
.chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.chip{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:transparent; cursor:pointer; font-size:12px; min-width:52px;
}
.chip:disabled{opacity:.35}
.chip i{display:grid; gap:2px}
.chip i b{background:var(--muted); display:block}
.chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
.chip[aria-pressed="true"] i b{background:var(--accent)}
.selbar .ops{display:flex; gap:8px; margin-top:10px}
.selbar .ops .btn{flex:1; padding:0 6px; min-width:0}
.cropbox{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:560px}
.frame{position:relative; overflow:hidden; touch-action:none; background:#000; cursor:grab; box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.frame:active{cursor:grabbing}
.frame img{position:absolute; max-width:none; pointer-events:none; user-select:none; -webkit-user-drag:none}
.frame::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
    linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px));}
.zoomrow{display:flex; align-items:center; gap:10px; width:100%; max-width:360px; color:#eee; font-size:13px}
.zoomrow input{flex:1; accent-color:#fff}
.cropbox p{color:#ddd; font-size:13px; margin:0; text-align:center}
.cropbox .ops{display:flex; gap:8px}

.overlay{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.show{display:flex}
.progress{background:var(--panel); padding:20px 24px; border-radius:8px; min-width:220px; text-align:center}
.progress .track{height:4px; background:var(--line); margin-top:12px; border-radius:2px; overflow:hidden}
.progress .fill{height:100%; width:0; background:var(--ink); transition:width .15s}
.result{display:flex; flex-direction:column; align-items:center; gap:12px; height:100%; width:100%; max-width:720px}
.result .imgwrap{flex:1 1 auto; min-height:0; overflow:auto; width:100%; border-radius:4px}
.result img{width:100%; display:block}
.result p{color:#ddd; font-size:13px; margin:0; text-align:center}
.result .ops{display:flex; gap:8px}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--page); padding:8px 16px; border-radius:18px; font-size:14px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.selbar,.toast,.progress .fill{transition:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="bar">
  <h1>拼貼排版</h1>
  <div class="actions">
    <label class="btn" tabindex="0">加入照片<input id="fileIn" type="file" accept="image/*" multiple hidden></label>
    <button class="btn primary" id="exportBtn" disabled>匯出圖片</button>
  </div>
</header>

<main>
  <section class="empty" id="empty">
    <div class="tiles" aria-hidden="true"><span class="a"></span><span class="b"></span><span></span><span class="c"></span><span></span><span></span><span class="b"></span></div>
    <label class="btn primary" tabindex="0">選擇照片<input id="fileIn2" type="file" accept="image/*" multiple hidden></label>
    <p>選幾張都可以，會依照片數量自動排版。<br>照片只在你的裝置上處理，不會上傳。</p>
  </section>

  <section id="stage" hidden>
    <p class="hint" id="hint"></p>
    <div class="board" id="board"></div>
    <p class="count" id="count"></p>

    <details class="settings">
      <summary>版面設定</summary>
      <div class="row"><label for="cols">欄數</label><input type="range" id="cols" min="1" max="8" step="1"><output id="colsOut"></output></div>
      <div class="row"><label for="gap">間距</label><input type="range" id="gap" min="0" max="60" step="1"><output id="gapOut"></output></div>
      <div class="row"><label for="margin">外框</label><input type="range" id="margin" min="0" max="160" step="2"><output id="marginOut"></output></div>
      <div class="row"><label for="radius">圓角</label><input type="range" id="radius" min="0" max="40" step="1"><output id="radiusOut"></output></div>
      <div class="row"><label>背景</label>
        <div class="swatches">
          <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="白色"></button>
          <button class="sw" data-c="#ededeb" style="background:#ededeb" aria-label="淺灰"></button>
          <button class="sw" data-c="#000000" style="background:#000000" aria-label="黑色"></button>
        </div><span></span>
      </div>
      <div class="row"><label for="width">匯出寬度</label>
        <select id="width"><option value="1080">1080 px</option><option value="2048">2048 px</option><option value="3000">3000 px</option></select><span></span>
      </div>
      <div class="btnrow">
        <button class="btn" id="smartBtn">隨機版型</button>
        <button class="btn" id="autoColsBtn">欄數自動</button>
        <button class="btn" id="equalBtn">全部等大</button>
        <button class="btn" id="shuffleBtn">打亂照片</button>
        <button class="btn" id="clearBtn">全部清除</button>
      </div>
      <p style="margin:0 0 14px;color:var(--muted);font-size:12px">版本 2026.10.06</p>
    </details>
  </section>
</main>

<div class="selbar" id="selbar" aria-hidden="true">
  <div class="inner">
    <div class="label">這格的大小（寬×高）</div>
    <div class="chips" id="chips"></div>
    <div class="ops">
      <button class="btn" id="cropBtn">裁切</button>
      <button class="btn" id="prevBtn">往前</button>
      <button class="btn" id="nextBtn">往後</button>
      <button class="btn" id="delBtn">移除</button>
      <button class="btn primary" id="doneBtn">完成</button>
    </div>
  </div>
</div>

<div class="overlay" id="cropOv">
  <div class="cropbox">
    <div class="frame" id="frame"><img id="cropImg" alt=""></div>
    <div class="zoomrow"><span>縮放</span><input type="range" id="zoom" min="1" max="5" step="0.01" aria-label="縮放"></div>
    <p>拖曳照片調整位置，雙指或滑桿縮放。</p>
    <div class="ops">
      <button class="btn" id="cropReset">重設</button>
      <button class="btn" id="cropCancel">取消</button>
      <button class="btn primary" id="cropDone">完成</button>
    </div>
  </div>
</div>

<div class="overlay" id="progOv"><div class="progress"><div id="progText">處理中</div><div class="track"><div class="fill" id="progFill"></div></div></div></div>

<div class="overlay" id="resOv">
  <div class="result">
    <div class="imgwrap"><img id="resImg" alt="拼貼結果"></div>
    <p id="resHint"></p>
    <div class="ops">
      <button class="btn" id="closeRes">返回編輯</button>
      <button class="btn primary" id="saveRes" hidden>儲存圖片</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const BASE = 2400;          // gap / margin / radius values are in px at this width
  const MAX_SIDE = 1600;      // longest side of each stored working copy
  const MAX_PIX = 16000000;   // stay under mobile canvas limits
  const MAX_ZOOM = 5;

  // Each item is one photo that carries its own cell size and crop,
  // so swapping or shuffling moves the photo together with its size and crop.
  const state = {
    items: [], selected: null,
    cols: 6, gap: 14, margin: 40, radius: 0, bg: '#ffffff', width: 2048,
    autoCols: true   // follows the photo count until the person moves the slider
  };
  let uid = 0;
  const nid = () => 'i' + (++uid);
  const $ = id => document.getElementById(id);
  const board = $('board');
  const byId = id => state.items.find(it => it.id === id);

  let downloads = null;
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') downloads = await window.claude.use('downloads');
    } catch (e) { downloads = null; }
  })();

  // ---------- loading ----------
  async function decode(file){
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) {
      const u = URL.createObjectURL(file);
      try { const im = new Image(); im.src = u; await im.decode(); return im; }
      finally { setTimeout(() => URL.revokeObjectURL(u), 2000); }
    }
  }
  async function loadFile(file){
    const src = await decode(file);
    const iw = src.naturalWidth || src.width, ih = src.naturalHeight || src.height;
    const k = Math.min(1, MAX_SIDE / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * k)), h = Math.max(1, Math.round(ih * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(src, 0, 0, w, h);
    if (src.close) src.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    c.width = c.height = 0;
    if (!blob) throw new Error('encode');
    return { url: URL.createObjectURL(blob), iw: w, ih: h };
  }
  async function addFiles(list){
    const files = Array.from(list || []).filter(f => !f.type || f.type.startsWith('image/'));
    if (!files.length) return;
    const wasEmpty = state.items.length === 0;
    showProgress('處理照片', 0, files.length);
    let fails = 0;
    for (let i = 0; i < files.length; i++){
      try {
        const p = await loadFile(files[i]);
        state.items.push({ id: nid(), url: p.url, iw: p.iw, ih: p.ih, w: 1, h: 1, cx: .5, cy: .5, zoom: 1 });
      } catch (e) { fails++; }
      showProgress('處理照片', i + 1, files.length);
    }
    hideProgress();
    if (state.items.length && (wasEmpty || state.autoCols)){
      if (state.autoCols) setCols(autoCols(state.items.length));
      smartLayout();
    } else render();
    if (fails) toast(fails + ' 張無法讀取，已略過');
  }
  ['fileIn', 'fileIn2'].forEach(id => $(id).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; }));
  document.querySelectorAll('label.btn[tabindex]').forEach(l => l.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); l.querySelector('input').click(); }
  }));

  // Column count that suits the number of photos picked
  function autoCols(n){
    if (n <= 1) return 1;
    if (n <= 4) return 2;
    if (n <= 9) return 3;
    if (n <= 16) return 4;
    if (n <= 30) return 5;
    if (n <= 60) return 6;
    if (n <= 100) return 7;
    return 8;
  }
  function setCols(c){
    state.cols = c; $('cols').value = c; $('colsOut').textContent = state.autoCols ? c + ' 自動' : c;
  }

  // ---------- layout ----------
  function pack(sizes, C){
    const occ = [];
    const used = (r, c) => occ[r] && occ[r][c];
    const mark = (r, c) => { (occ[r] = occ[r] || [])[c] = true; };
    const pos = []; let rows = 0;
    for (const s of sizes){
      const w = Math.min(s.w, C), h = s.h;
      let placed = false;
      for (let r = 0; !placed; r++){
        for (let c = 0; c <= C - w && !placed; c++){
          let ok = true;
          for (let y = 0; y < h && ok; y++) for (let x = 0; x < w && ok; x++) if (used(r + y, c + x)) ok = false;
          if (ok){
            for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) mark(r + y, c + x);
            pos.push({ x: c, y: r, w, h }); rows = Math.max(rows, r + h); placed = true;
          }
        }
      }
    }
    return { pos, rows, occ };
  }
  const areaOf = (sizes, C) => sizes.reduce((a, s) => a + Math.min(s.w, C) * s.h, 0);
  const holesOf = (sizes, C) => pack(sizes, C).rows * C - areaOf(sizes, C);
  function pickSize(ar, C){
    const r = Math.random();
    if (C >= 3 && r < 0.10) return { w: 2, h: 2 };
    if (C === 1) return (ar < 0.85 && r < 0.5) ? { w: 1, h: 2 } : { w: 1, h: 1 };
    if (ar > 1.25 && r < 0.45) return { w: 2, h: 1 };
    if (ar < 0.85 && r < 0.32) return { w: 1, h: 2 };
    return { w: 1, h: 1 };
  }
  function smartLayout(){
    const C = state.cols; let best = null;
    for (let t = 0; t < 400; t++){
      const sizes = state.items.map(it => pickSize(it.iw / it.ih, C));
      const holes = holesOf(sizes, C);
      if (!best || holes < best.holes) best = { sizes, holes };
      if (holes === 0 && t > 20) break;
    }
    state.items.forEach((it, i) => { it.w = best.sizes[i].w; it.h = best.sizes[i].h; });
    state.selected = null; render();
  }
  function shuffleItems(){
    // Sizes stay with their photos; try many orders and keep the one with the fewest gaps.
    const C = state.cols; let best = null;
    for (let t = 0; t < 300; t++){
      const order = state.items.slice();
      for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      const holes = holesOf(order, C);
      if (!best || holes < best.holes) best = { order, holes };
      if (holes === 0 && t > 20) break;
    }
    state.items = best.order; state.selected = null; render();
  }
  function dims(W, rows){
    const s = W / BASE, C = state.cols;
    const gap = state.gap * s, margin = state.margin * s, radius = state.radius * s;
    const cell = (W - 2 * margin - (C - 1) * gap) / C;
    const H = rows ? 2 * margin + rows * cell + (rows - 1) * gap : 2 * margin;
    return { gap, margin, radius, cell, H };
  }

  // ---------- crop math ----------
  // cx, cy: point of the photo (0..1) placed at the cell centre; zoom >= 1 on top of "cover".
  function clampCenter(it, cw, ch, cx, cy, zoom){
    const sc = Math.max(cw / it.iw, ch / it.ih) * zoom;
    const dw = it.iw * sc, dh = it.ih * sc;
    const hx = cw / 2 / dw, hy = ch / 2 / dh;
    return { cx: Math.min(1 - hx, Math.max(hx, cx)), cy: Math.min(1 - hy, Math.max(hy, cy)), dw, dh };
  }
  function placement(it, cw, ch, crop){
    const c = crop || it;
    const r = clampCenter(it, cw, ch, c.cx, c.cy, c.zoom);
    return { left: cw / 2 - r.cx * r.dw, top: ch / 2 - r.cy * r.dh, w: r.dw, h: r.dh, cx: r.cx, cy: r.cy };
  }

  // ---------- render ----------
  const els = new Map();
  function render(){
    const has = state.items.length > 0;
    $('empty').hidden = has; $('stage').hidden = !has; $('exportBtn').disabled = !has;
    if (!has){ board.innerHTML = ''; els.clear(); updateSelbar(); return; }
    const C = state.cols;
    const { pos, rows, occ } = pack(state.items, C);
    const W = board.clientWidth || 340;
    const d = dims(W, rows);
    board.style.height = d.H + 'px';
    board.style.background = state.bg;
    board.classList.toggle('picking', !!state.selected);

    const alive = new Set();
    state.items.forEach((it, i) => {
      alive.add(it.id);
      let el = els.get(it.id);
      if (!el){
        el = document.createElement('div'); el.className = 'cell'; el.dataset.id = it.id;
        el.setAttribute('role', 'button'); el.tabIndex = 0;
        const img = document.createElement('img'); img.alt = ''; img.decoding = 'async'; img.draggable = false; img.src = it.url;
        el.appendChild(img); board.appendChild(el); els.set(it.id, el);
      }
      const p = pos[i];
      const cw = p.w * d.cell + (p.w - 1) * d.gap, ch = p.h * d.cell + (p.h - 1) * d.gap;
      el.style.left = (d.margin + p.x * (d.cell + d.gap)) + 'px';
      el.style.top = (d.margin + p.y * (d.cell + d.gap)) + 'px';
      el.style.width = cw + 'px';
      el.style.height = ch + 'px';
      el.style.borderRadius = d.radius + 'px';
      const pl = placement(it, cw, ch), img = el.firstChild;
      img.style.left = pl.left + 'px'; img.style.top = pl.top + 'px';
      img.style.width = pl.w + 'px'; img.style.height = pl.h + 'px';
      el.classList.toggle('sel', state.selected === it.id);
      el.setAttribute('aria-label', '第 ' + (i + 1) + ' 張');
    });
    for (const [id, el] of els) if (!alive.has(id)){ el.remove(); els.delete(id); }

    board.querySelectorAll('.hole').forEach(h => h.remove());
    for (let r = 0; r < rows; r++) for (let c = 0; c < C; c++){
      if (occ[r] && occ[r][c]) continue;
      const h = document.createElement('div'); h.className = 'hole';
      h.style.left = (d.margin + c * (d.cell + d.gap)) + 'px';
      h.style.top = (d.margin + r * (d.cell + d.gap)) + 'px';
      h.style.width = h.style.height = d.cell + 'px';
      h.style.borderRadius = d.radius + 'px';
      board.appendChild(h);
    }
    const holes = rows * C - areaOf(state.items, C);
    $('count').textContent = '共 ' + state.items.length + ' 張照片' + (holes ? '，有 ' + holes + ' 個空格（灰色處，匯出時是背景色）' : '');
    $('hint').textContent = state.selected
      ? '再點另一張照片就會交換位置（大小和裁切會跟著照片走），或在下方調整這張。'
      : '點一張照片選取，再點另一張就會交換位置。';
    updateSelbar();
  }

  // ---------- selection ----------
  function onCell(id){
    if (!state.selected) state.selected = id;
    else if (state.selected === id) state.selected = null;
    else {
      const a = state.items.findIndex(it => it.id === state.selected), b = state.items.findIndex(it => it.id === id);
      [state.items[a], state.items[b]] = [state.items[b], state.items[a]];
      state.selected = null;
    }
    render();
  }
  board.addEventListener('click', e => {
    const c = e.target.closest('.cell');
    if (c) onCell(c.dataset.id);
    else if (state.selected){ state.selected = null; render(); }
  });
  board.addEventListener('keydown', e => {
    const c = e.target.closest('.cell');
    if (c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); onCell(c.dataset.id); }
  });

  const SIZES = [[1,1],[2,1],[1,2],[2,2],[3,2],[3,3]];
  const chips = $('chips');
  SIZES.forEach(([w, h]) => {
    const b = document.createElement('button'); b.className = 'chip'; b.dataset.w = w; b.dataset.h = h;
    const i = document.createElement('i');
    i.style.gridTemplateColumns = 'repeat(' + w + ',7px)'; i.style.gridAutoRows = '7px';
    for (let k = 0; k < w * h; k++) i.appendChild(document.createElement('b'));
    b.appendChild(i); b.appendChild(document.createTextNode(w + '×' + h));
    b.addEventListener('click', () => {
      const it = byId(state.selected); if (!it) return;
      it.w = w; it.h = h; render();
    });
    chips.appendChild(b);
  });
  function updateSelbar(){
    const it = byId(state.selected);
    $('selbar').classList.toggle('show', !!it);
    $('selbar').setAttribute('aria-hidden', it ? 'false' : 'true');
    if (!it) return;
    chips.querySelectorAll('.chip').forEach(c => {
      c.setAttribute('aria-pressed', (+c.dataset.w === it.w && +c.dataset.h === it.h) ? 'true' : 'false');
      c.disabled = +c.dataset.w > state.cols;
    });
    const i = state.items.indexOf(it);
    $('prevBtn').disabled = i === 0; $('nextBtn').disabled = i === state.items.length - 1;
  }
  function move(dir){
    const i = state.items.findIndex(it => it.id === state.selected), j = i + dir;
    if (i < 0 || j < 0 || j >= state.items.length) return;
    [state.items[i], state.items[j]] = [state.items[j], state.items[i]]; render();
  }
  $('prevBtn').addEventListener('click', () => move(-1));
  $('nextBtn').addEventListener('click', () => move(1));
  $('doneBtn').addEventListener('click', () => { state.selected = null; render(); });
  $('delBtn').addEventListener('click', () => {
    const i = state.items.findIndex(it => it.id === state.selected); if (i < 0) return;
    const [it] = state.items.splice(i, 1);
    URL.revokeObjectURL(it.url);
    state.selected = null;
    if (state.autoCols && state.items.length && autoCols(state.items.length) !== state.cols){
      setCols(autoCols(state.items.length)); smartLayout();
    } else render();
  });

  // ---------- crop editor ----------
  const frame = $('frame'), cropImg = $('cropImg'), zoomIn = $('zoom');
  let crop = null; // { it, fw, fh, cx, cy, zoom }
  function openCrop(){
    const it = byId(state.selected); if (!it) return;
    const C = state.cols, w = Math.min(it.w, C), h = it.h;
    const d = dims(BASE, 1);
    const cw = w * d.cell + (w - 1) * d.gap, ch = h * d.cell + (h - 1) * d.gap;
    const a = cw / ch;
    const availW = Math.min(window.innerWidth - 32, 560), availH = window.innerHeight * 0.6;
    const fw = Math.min(availW, availH * a), fh = fw / a;
    frame.style.width = fw + 'px'; frame.style.height = fh + 'px';
    cropImg.src = it.url;
    crop = { it, fw, fh, cx: it.cx, cy: it.cy, zoom: it.zoom };
    zoomIn.value = crop.zoom;
    drawCrop();
    $('cropOv').classList.add('show');
  }
  function drawCrop(){
    const pl = placement(crop.it, crop.fw, crop.fh, crop);
    crop.cx = pl.cx; crop.cy = pl.cy;
    cropImg.style.left = pl.left + 'px'; cropImg.style.top = pl.top + 'px';
    cropImg.style.width = pl.w + 'px'; cropImg.style.height = pl.h + 'px';
  }
  function setZoom(z){
    crop.zoom = Math.min(MAX_ZOOM, Math.max(1, z));
    zoomIn.value = crop.zoom; drawCrop();
  }
  const pts = new Map(); let pinch = null;
  frame.addEventListener('pointerdown', e => {
    if (!crop) return;
    frame.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2){
      const [a, b] = [...pts.values()];
      pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: crop.zoom };
    }
  });
  frame.addEventListener('pointermove', e => {
    if (!crop || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
    pts.set(e.pointerId, cur);
    if (pts.size === 1){
      const pl = placement(crop.it, crop.fw, crop.fh, crop);
      crop.cx -= (cur.x - prev.x) / pl.w; crop.cy -= (cur.y - prev.y) / pl.h;
      drawCrop();
    } else if (pts.size === 2 && pinch){
      const [a, b] = [...pts.values()];
      setZoom(pinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinch.dist);
    }
  });
  const endPt = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; };
  frame.addEventListener('pointerup', endPt);
  frame.addEventListener('pointercancel', endPt);
  frame.addEventListener('wheel', e => { if (!crop) return; e.preventDefault(); setZoom(crop.zoom * Math.exp(-e.deltaY * 0.002)); }, { passive: false });
  zoomIn.addEventListener('input', () => setZoom(+zoomIn.value));
  $('cropReset').addEventListener('click', () => { crop.cx = .5; crop.cy = .5; setZoom(1); });
  $('cropCancel').addEventListener('click', () => { crop = null; pts.clear(); $('cropOv').classList.remove('show'); });
  $('cropDone').addEventListener('click', () => {
    Object.assign(crop.it, { cx: crop.cx, cy: crop.cy, zoom: crop.zoom });
    crop = null; pts.clear(); $('cropOv').classList.remove('show'); render();
  });
  $('cropBtn').addEventListener('click', openCrop);

  // ---------- settings ----------
  function bindRange(id){
    const el = $(id), out = $(id + 'Out');
    el.value = state[id]; out.textContent = state[id];
    el.addEventListener('input', () => { state[id] = +el.value; out.textContent = state[id]; render(); });
  }
  ['cols', 'gap', 'margin', 'radius'].forEach(bindRange);
  $('cols').addEventListener('input', () => { state.autoCols = false; $('colsOut').textContent = state.cols; });
  $('autoColsBtn').addEventListener('click', () => {
    state.autoCols = true;
    if (state.items.length){ setCols(autoCols(state.items.length)); smartLayout(); }
  });
  const sws = document.querySelectorAll('.sw');
  const markSw = () => sws.forEach(b => b.setAttribute('aria-pressed', b.dataset.c === state.bg ? 'true' : 'false'));
  sws.forEach(b => b.addEventListener('click', () => { state.bg = b.dataset.c; markSw(); render(); }));
  markSw();
  $('width').value = String(state.width);
  $('width').addEventListener('change', e => { state.width = +e.target.value; });
  $('smartBtn').addEventListener('click', smartLayout);
  $('equalBtn').addEventListener('click', () => { state.items.forEach(it => { it.w = 1; it.h = 1; }); state.selected = null; render(); });
  $('shuffleBtn').addEventListener('click', shuffleItems);
  $('clearBtn').addEventListener('click', () => {
    if (!confirm('要移除全部照片嗎？')) return;
    state.items.forEach(it => URL.revokeObjectURL(it.url));
    state.items = []; state.selected = null; state.autoCols = true; setCols(6); render();
  });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 80); });

  // ---------- export ----------
  function roundPath(ctx, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    if (r <= 0){ ctx.rect(x, y, w, h); return; }
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  let resultBlob = null, resultUrl = null;
  async function exportImage(){
    if (!state.items.length) return;
    state.selected = null; render();
    const C = state.cols;
    const { pos, rows } = pack(state.items, C);
    let W = state.width, d = dims(W, rows), shrunk = false;
    if (W * d.H > MAX_PIX){ W = Math.floor(W * Math.sqrt(MAX_PIX / (W * d.H))); d = dims(W, rows); shrunk = true; }
    const H = Math.round(d.H);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = state.bg; ctx.fillRect(0, 0, W, H);
    showProgress('產生圖片', 0, state.items.length);
    for (let i = 0; i < state.items.length; i++){
      const it = state.items[i], p = pos[i];
      const x = d.margin + p.x * (d.cell + d.gap), y = d.margin + p.y * (d.cell + d.gap);
      const w = p.w * d.cell + (p.w - 1) * d.gap, h = p.h * d.cell + (p.h - 1) * d.gap;
      const img = new Image(); img.src = it.url;
      try { await img.decode(); } catch (e) { continue; }
      const pl = placement(it, w, h);
      ctx.save();
      roundPath(ctx, x, y, w, h, d.radius); ctx.clip();
      ctx.drawImage(img, x + pl.left, y + pl.top, pl.w, pl.h);
      ctx.restore();
      showProgress('產生圖片', i + 1, state.items.length);
    }
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
    cv.width = cv.height = 0;
    hideProgress();
    if (!blob){ toast('圖片產生失敗，試試較小的匯出寬度'); return; }
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultBlob = blob; resultUrl = URL.createObjectURL(blob);
    $('resImg').src = resultUrl;
    $('saveRes').hidden = !(downloads || canShareFile(blob));
    $('resHint').textContent = ((downloads || canShareFile(blob)) ? '按「儲存圖片」選「儲存影像」，或長按圖片存到相簿。' : '長按圖片即可存到相簿。')
      + (shrunk ? ' 圖片太長，寬度已自動縮為 ' + W + ' px。' : '');
    $('resOv').classList.add('show');
  }
  $('exportBtn').addEventListener('click', exportImage);
  $('closeRes').addEventListener('click', () => $('resOv').classList.remove('show'));
  $('saveRes').addEventListener('click', async () => {
    if (!resultBlob) return;
    const t = new Date(), pad = n => String(n).padStart(2, '0');
    const name = 'collage-' + t.getFullYear() + pad(t.getMonth() + 1) + pad(t.getDate()) + '-' + pad(t.getHours()) + pad(t.getMinutes()) + '.jpg';
    if (!downloads){
      try { await navigator.share({ files: [new File([resultBlob], name, { type: 'image/jpeg' })] }); }
      catch (e) { if (!e || e.name !== 'AbortError') $('resHint').textContent = '請長按圖片存到相簿。'; }
      return;
    }
    try { await downloads.save({ filename: name, data: resultBlob }); toast('已儲存'); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited'){ toast('稍等一下再試'); return; }
      $('saveRes').hidden = true; $('resHint').textContent = '這裡無法直接儲存，請長按圖片存到相簿。';
    }
  });

  // ---------- helpers ----------
  function canShareFile(blob){
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([blob], 'a.jpg', { type: 'image/jpeg' })] })); }
    catch (e) { return false; }
  }
  function showProgress(label, n, total){
    $('progOv').classList.add('show');
    $('progText').textContent = label + ' ' + n + ' / ' + total;
    $('progFill').style.width = (total ? n / total * 100 : 0) + '%';
  }
  function hideProgress(){ $('progOv').classList.remove('show'); }
  let tt;
  function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

  render();
})();
</script>
</body>
</html>
